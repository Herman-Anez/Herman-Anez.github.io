name: Deploy to GitHub Pages

on:
  push:
    branches:
      - publish
  # Permite ejecutar el flujo manualmente desde la pestaña de Actions en GitHub
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: personal-page/pnpm-lock.yaml

      # Optimiza los tiempos de build subsiguientes cacheando el compilador de Next.js
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            personal-page/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('personal-page/pnpm-lock.yaml') }}-${{ hashFiles('personal-page/src/**/*.[jt]s', 'personal-page/src/**/*.[jt]sx', 'personal-page/src/**/*.mdx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('personal-page/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: personal-page

      - name: Build local packages
        run: |
          pnpm -C packages/i18n run build
          mkdir -p node_modules/@herman/i18n/dist
          cp -r packages/i18n/dist/* node_modules/@herman/i18n/dist/
        working-directory: personal-page

      - name: Build with Next.js (triggers generate-rss.ts & next build)
        env:
          NEXT_PUBLIC_PAGE_ACCESS_PASSWORD: ${{ vars.NEXT_PUBLIC_PAGE_ACCESS_PASSWORD }}
          NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
        run: pnpm run build
        working-directory: personal-page

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static files artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./personal-page/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
